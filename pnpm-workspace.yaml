packages:
  - "apps/*"
  - "packages/*"
  - "tools/*"

allowBuilds:
  esbuild: true
  unrs-resolver: set this to true or false

onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - esbuild
  - sharp
  - unrs-resolver

# Security: next@15 pins postcss@8.4.31 (GHSA-6g55-p6wh-862q, GHSA-r28c-9q8g-f849,
# GHSA-fxqj-rqcc-2cmp, GHSA-qx2v-qp2m-jg93). Drop this once on next@16+, which ships postcss>=8.5.23.
overrides:
  next>postcss: ^8.5.28
