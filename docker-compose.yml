services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: valt
      POSTGRES_PASSWORD: valt # local dev only
      POSTGRES_DB: valt
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U valt -d valt"]
      interval: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    ports:
      - "8000:8000"
    environment:
      API_CORS_ORIGINS: '["http://localhost:3000"]'
      API_DATABASE_URL: postgresql+psycopg://valt:valt@postgres:5432/valt
    volumes:
      - ./apps/api/src:/app/src
      - ./apps/api/migrations:/app/migrations
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn valt_api.main:app --host 0.0.0.0 --port 8000 --reload --app-dir src"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      API_INTERNAL_URL: http://api:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api

volumes:
  pgdata:
