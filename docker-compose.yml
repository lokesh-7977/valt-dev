services:
  api:
    build:
      context: ./apps/api
    ports:
      - "8000:8000"
    environment:
      API_CORS_ORIGINS: '["http://localhost:3000"]'
    volumes:
      - ./apps/api/src:/app/src
    command: uvicorn valt_api.main:app --host 0.0.0.0 --port 8000 --reload --app-dir src

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      API_INTERNAL_URL: http://api:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api
